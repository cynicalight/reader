      "/api/documents/{id}/annotations/{annotation}":
        {
          "patch":
            {
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "in": "path",
                    "name": "annotation",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": [],
                              "properties":
                                {
                                  "note": { "type": "string" },
                                  "answerId":
                                    {
                                      "type": "string",
                                      "description": "Message ID of this document; empty clears",
                                    },
                                  "resolved": { "type": "boolean" },
                                  "color":
                                    {
                                      "type": "string",
                                      "pattern": "^#[0-9a-fA-F]{6}$",
                                    },
                                  "tags":
                                    {
                                      "type": "array",
                                      "items": { "type": "string" },
                                      "maxItems": 10,
                                      "description": "Replaces the tags; trimmed and de-duplicated without regard to case",
                                    },
                                },
                              "description": "At least one of note, answerId, resolved, color or tags",
                            },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Updated note; annotation identity, kind and location are preserved.",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Annotation" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
          "delete":
