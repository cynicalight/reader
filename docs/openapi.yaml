                    },
                  "openQuestionCount":
                    {
                      "type": "number",
                      "description": "Questions without an answer that are not resolved",
                    },
                  "related":
                    {
                      "type": "array",
                      "items": { "type": "string" },
                      "description": "Documents linked as related, in both directions; may include trashed ones",
                    },
                },
              "required":
                [
                  "category",
                  "categorySource",
                  "classificationStatus",
                  "classificationError",
                  "tags",
                  "folders",
                  "id",
                  "type",
                  "title",
                  "author",
                  "size",
                  "createdAt",
                  "lastOpenedAt",
                  "favorite",
                  "percentage",
                  "library",
                  "metadata",
                  "readingStatus",
                  "noteCount",
                  "highlightCount",
                  "openQuestionCount",
                  "related",
                ],
            },
          "Annotation":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "documentId": { "type": "string" },
                  "kind":
                    {
                      "enum":
                        [
                          "highlight",
                          "underline",
                          "note",
                          "question",
                          "bookmark",
                        ],
                    },
                  "location":
                    { "$ref": "#/components/schemas/DocumentLocation" },
                  "quote": { "type": "string" },
                  "note": { "type": "string" },
                  "color": { "type": "string" },
                  "createdAt": { "type": "string" },
                  "answerId":
                    {
                      "type": "string",
