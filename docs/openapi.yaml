                {
                  "name": { "type": "string", "minLength": 1, "maxLength": 80 },
                  "tags":
                    {
                      "type": "array",
                      "minItems": 1,
                      "maxItems": 30,
                      "items":
                        { "type": "string", "minLength": 1, "maxLength": 40 },
                    },
                  "match": { "type": "string", "enum": ["all", "any"] },
                },
              "required": ["name", "tags", "match"],
            },
          "TagBoard":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string", "minLength": 1, "maxLength": 80 },
                  "tags":
                    {
                      "type": "array",
                      "minItems": 1,
                      "maxItems": 30,
                      "items":
                        { "type": "string", "minLength": 1, "maxLength": 40 },
                    },
                  "match": { "type": "string", "enum": ["all", "any"] },
                },
              "required": ["id", "name", "tags", "match"],
            },
          "TokenCounts":
            {
              "type": "object",
