  "components":
    {
      "securitySchemes": { "session": { "type": "http", "scheme": "bearer" } },
      "schemas":
        {
          "DocumentLocation":
            {
              "oneOf":
                [
                  {
                    "type": "object",
                    "properties":
                      {
                        "type": { "const": "pdf" },
                        "page": { "type": "integer", "minimum": 1 },
                        "x": { "type": "number" },
                        "y": { "type": "number" },
                        "quote": { "type": "string" },
                        "rects":
                          {
                            "type": "array",
                            "items":
                              {
                                "type": "object",
                                "properties":
                                  {
                                    "x": { "type": "number" },
                                    "y": { "type": "number" },
                                    "width": { "type": "number" },
                                    "height": { "type": "number" },
                                  },
                                "required": ["x", "y", "width", "height"],
                              },
                          },
                      },
                    "required": ["type", "page"],
                  },
                  {
                    "type": "object",
                    "properties":
                      {
                        "type": { "const": "epub" },
                        "href": { "type": "string" },
                        "locator": { "type": "string" },
                        "progression": { "type": "number" },
                        "quote": { "type": "string" },
                      },
                    "required": ["type", "href"],
                  },
                ],
            },
          "Document":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "type": { "enum": ["pdf", "epub"] },
                  "title": { "type": "string" },
                  "author": { "type": "string" },
                  "size": { "type": "number" },
                  "createdAt": { "type": "string" },
                  "lastOpenedAt": { "type": "string" },
                  "favorite": { "type": "boolean" },
                  "percentage": { "type": "number" },
                  "progress":
                    { "$ref": "#/components/schemas/DocumentLocation" },
                },
              "required":
                [
                  "id",
                  "type",
                  "title",
                  "author",
                  "size",
                  "createdAt",
                  "lastOpenedAt",
                  "favorite",
                  "percentage",
                ],
            },
          "Annotation":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "documentId": { "type": "string" },
                  "kind":
                    { "enum": ["highlight", "underline", "note", "bookmark"] },
                  "location":
                    { "$ref": "#/components/schemas/DocumentLocation" },
                  "quote": { "type": "string" },
                  "note": { "type": "string" },
                  "color": { "type": "string" },
                  "createdAt": { "type": "string" },
                },
              "required":
                [
                  "id",
                  "documentId",
                  "kind",
                  "location",
                  "quote",
                  "note",
                  "color",
                  "createdAt",
                ],
            },
          "SearchResult":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "excerpt": { "type": "string" },
                  "location":
                    { "$ref": "#/components/schemas/DocumentLocation" },
                },
              "required": ["id", "excerpt", "location"],
            },
          "Message":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "documentId": { "type": "string" },
                  "role": { "enum": ["user", "assistant"] },
                  "content": { "type": "string" },
                  "createdAt": { "type": "string" },
                  "context": { "type": "string" },
                  "attachments":
                    {
                      "type": "array",
                      "items":
                        {
                          "type": "object",
                          "properties":
                            {
                              "id": { "type": "string" },
                              "page": { "type": "integer" },
                              "label": { "type": "string" },
                              "caption": { "type": "string" },
                            },
                          "required": ["id", "page", "label"],
                        },
                    },
                  "references":
                    {
                      "type": "array",
                      "items":
                        {
                          "type": "object",
                          "properties":
                            {
                              "text": { "type": "string" },
                              "kind": { "enum": ["selection", "section"] },
                              "location":
                                {
                                  "$ref": "#/components/schemas/DocumentLocation",
                                },
                            },
                          "required": ["text", "location"],
                        },
                    },
                },
              "required": ["id", "documentId", "role", "content", "createdAt"],
            },
          "Provider":
            {
              "type": "object",
              "properties":
                {
                  "id":
                    { "type": "string", "enum": ["codex", "claude", "kimi"] },
                  "installed": { "type": "boolean" },
                  "authenticated": { "type": "boolean" },
                  "status": { "type": "string" },
                },
              "required": ["id", "installed", "authenticated", "status"],
            },
          "Settings": { "type": "object", "additionalProperties": true },
          "Error":
            {
              "type": "object",
              "properties": { "error": { "type": "string" } },
              "required": ["error"],
            },
          "Processing":
            {
              "type": "object",
              "properties":
                {
                  "documentId": { "type": "string" },
                  "phase":
                    {
                      "type": "string",
                      "enum": ["learning", "settling", "ready"],
                    },
                  "status":
                    {
                      "type": "string",
                      "enum":
                        ["queued", "running", "waiting", "failed", "complete"],
                    },
                  "pagesDone": { "type": "integer" },
                  "pagesTotal": { "type": "integer" },
                  "assetsDone": { "type": "integer" },
                  "assetsTotal": { "type": "integer" },
                  "detail": { "type": "string" },
                  "warning": { "type": "string" },
                  "updatedAt": { "type": "string" },
                  "incomplete": { "type": "boolean" },
                },
              "required":
                [
                  "documentId",
                  "phase",
                  "status",
                  "pagesDone",
                  "pagesTotal",
                  "assetsDone",
                  "assetsTotal",
                  "detail",
                  "updatedAt",
                ],
            },
          "PDFBlock":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "page": { "type": "integer" },
                  "label": { "type": "string" },
                  "bounds":
                    {
                      "type": "object",
                      "properties":
                        {
                          "x": { "type": "number" },
                          "y": { "type": "number" },
                          "width": { "type": "number" },
                          "height": { "type": "number" },
                        },
                      "required": ["x", "y", "width", "height"],
                    },
                  "text": { "type": "string" },
                  "kind": { "enum": ["selection", "section"] },
                  "image": { "type": "string" },
                  "caption": { "type": "string" },
                },
              "required": ["id", "page", "label", "bounds", "text"],
            },
          "AICapability":
            {
              "type": "object",
              "properties":
                {
                  "text": { "type": "boolean" },
                  "vision": { "type": "boolean" },
                  "checkedAt": { "type": "string" },
                  "error": { "type": "string" },
                },
              "required": ["text", "vision", "checkedAt"],
            },
          "APIConnection":
            {
              "type": "object",
              "properties":
                {
                  "url": { "type": "string" },
                  "model": { "type": "string" },
                  "key": { "type": "string", "writeOnly": true },
                  "hasKey": { "type": "boolean" },
                },
              "required": ["url", "model", "hasKey"],
            },
          "AgentModel":
            {
              "type": "object",
              "required": ["id", "name", "description", "isDefault"],
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "description": { "type": "string" },
                  "isDefault": { "type": "boolean" },
                  "aliases": { "type": "array", "items": { "type": "string" } },
                },
            },
          "ReasoningEffort":
            { "type": "string", "enum": ["low", "medium", "high", "max"] },
          "AIConfig":
            {
              "type": "object",
              "properties":
                {
                  "primary": { "type": "string" },
                  "models":
                    {
                      "type": "object",
                      "additionalProperties": { "type": "string" },
                    },
                  "efforts":
                    {
                      "type": "object",
                      "description": "Reader effort by provider and model ID. Defaults to medium; adapted to SDK-native values on invocation.",
                      "additionalProperties":
                        {
                          "type": "object",
                          "additionalProperties":
                            { "$ref": "#/components/schemas/ReasoningEffort" },
                        },
                    },
                  "textAPI": { "$ref": "#/components/schemas/APIConnection" },
                  "imageAPI": { "$ref": "#/components/schemas/APIConnection" },
                  "capabilities":
                    {
                      "type": "object",
                      "additionalProperties":
                        { "$ref": "#/components/schemas/AICapability" },
                    },
                },
              "required":
                ["primary", "models", "textAPI", "imageAPI", "capabilities"],
            },
        },
    },
}
