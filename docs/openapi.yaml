      "/api/documents/{id}/chat":
        {
          "post":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "SSE v1: status, delta, fallback, error, done. See ChatStreamEvent. done is sent once only after confirmed upstream completion and successful assistant persistence. Fallback is allowed only before the first text delta. Disconnect cancels upstream; missing done requires checking messages, never automatic POST replay.",
                      "content":
                        {
                          "text/event-stream":
                            {
                              "schema":
                                {
                                  "type": "string",
                                  "description": "SSE frames separated by blank lines. See ChatStreamEvent for each event data shape.",
                                },
                              "x-event-schema":
                                {
                                  "$ref": "#/components/schemas/ChatStreamEvent",
                                },
                              "examples":
                                {
                                  "success":
                                    {
                                      "value": "event: status\ndata: {\"status\":\"reading\"}\n\nevent: delta\ndata: {\"text\":\"回答\"}\n\nevent: done\ndata: {\"ok\":true}\n\n",
                                    },
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "provider":
                                    { "enum": ["codex", "claude", "kimi"] },
                                  "attachments":
                                    {
                                      "type": "array",
                                      "maxItems": 4,
                                      "items":
                                        {
                                          "type": "string",
                                          "pattern": "^p[1-9][0-9]*-b[1-9][0-9]*$",
                                        },
                                    },
                                  "prompt": { "type": "string" },
                                  "context": { "type": "string" },
                                  "references":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "type": "object",
                                          "properties":
                                            {
                                              "text": { "type": "string" },
                                              "kind":
                                                {
                                                  "enum":
                                                    ["selection", "section"],
                                                },
                                              "location":
                                                {
                                                  "$ref": "#/components/schemas/DocumentLocation",
                                                },
                                            },
                                          "required": ["text", "location"],
                                        },
                                    },
                                },
                              "required": ["provider", "prompt", "context"],
                            },
                        },
                    },
                },
            },
        },
