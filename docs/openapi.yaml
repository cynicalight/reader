      "/api/documents/{id}/chat":
        {
          "post":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "SSE: status, delta {text}, fallback {message}, error {error}, done {ok}. Disconnection cancels CLI.",
                      "content":
                        {
                          "text/event-stream":
                            { "schema": { "type": "string" } },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "provider":
                                    { "enum": ["codex", "claude", "kimi"] },
                                  "attachments":
                                    {
                                      "type": "array",
                                      "maxItems": 4,
                                      "items":
                                        {
                                          "type": "string",
                                          "pattern": "^p[1-9][0-9]*-b[1-9][0-9]*$",
                                        },
                                    },
                                  "prompt": { "type": "string" },
                                  "context": { "type": "string" },
                                  "references":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "type": "object",
                                          "properties":
                                            {
                                              "text": { "type": "string" },
                                              "kind":
                                                {
                                                  "enum":
                                                    ["selection", "section"],
                                                },
                                              "location":
                                                {
                                                  "$ref": "#/components/schemas/DocumentLocation",
                                                },
                                            },
                                          "required": ["text", "location"],
                                        },
                                    },
                                },
                              "required": ["provider", "prompt", "context"],
                            },
                        },
                    },
                },
            },
        },
