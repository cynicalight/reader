          "Settings": { "type": "object", "additionalProperties": true },
          "ChatStreamEvent":
            {
              "description": "Decoded SSE event union for documentation and generated types only. Wire uses event: NAME and data: JSON lines; no envelope is transmitted. Append delta text verbatim. Only done confirms successful persistence. EOF is not completion. After error/done ignore late data. No automatic POST replay.",
              "oneOf":
                [
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["event", "data"],
                    "properties":
                      {
                        "event": { "type": "string", "enum": ["status"] },
                        "data":
                          {
                            "type": "object",
                            "additionalProperties": false,
                            "required": ["status"],
                            "properties":
                              {
                                "status":
                                  {
                                    "type": "string",
                                    "enum": ["reading", "reading-image"],
                                  },
                              },
                          },
                      },
                  },
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["event", "data"],
                    "properties":
                      {
                        "event": { "type": "string", "enum": ["delta"] },
                        "data":
                          {
                            "type": "object",
                            "additionalProperties": false,
                            "required": ["text"],
                            "properties": { "text": { "type": "string" } },
                          },
                      },
                  },
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["event", "data"],
                    "properties":
                      {
                        "event": { "type": "string", "enum": ["fallback"] },
                        "data":
                          {
                            "type": "object",
                            "additionalProperties": false,
                            "required": ["message"],
                            "properties": { "message": { "type": "string" } },
                          },
                      },
                  },
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["event", "data"],
                    "properties":
                      {
                        "event": { "type": "string", "enum": ["error"] },
                        "data":
                          {
                            "type": "object",
                            "additionalProperties": false,
                            "required": ["error"],
                            "properties": { "error": { "type": "string" } },
                          },
                      },
                  },
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["event", "data"],
                    "properties":
                      {
                        "event": { "type": "string", "enum": ["done"] },
                        "data":
                          {
                            "type": "object",
                            "additionalProperties": false,
                            "required": ["ok"],
                            "properties":
                              { "ok": { "type": "boolean", "enum": [true] } },
                          },
                      },
                  },
                ],
            },
          "Error":
            {
