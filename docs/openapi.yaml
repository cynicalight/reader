                                    "y": { "type": "number" },
                                    "width": { "type": "number" },
                                    "height": { "type": "number" },
                                  },
                                "required": ["x", "y", "width", "height"],
                              },
                          },
                        "sentenceLink":
                          { "$ref": "#/components/schemas/SentenceLink" },
                        "translation":
                          {
                            "$ref": "#/components/schemas/TranslationLocation",
                          },
                      },
                    "required": ["type", "page"],
                  },
                  { "$ref": "#/components/schemas/EPUBLocation" },
                ],
            },
          "Document":
            {
              "type": "object",
              "properties":
                {
                  "category": { "enum": ["book", "article", "paper"] },
                  "categorySource": { "enum": ["default", "ai", "manual"] },
                  "classificationStatus":
                    { "enum": ["pending", "running", "failed", "done"] },
                  "classificationError": { "type": "string" },
                  "tags":
                    {
                      "type": "array",
                      "maxItems": 30,
                      "items":
                        { "type": "string", "minLength": 1, "maxLength": 40 },
                    },
                  "folders":
                    {
                      "type": "array",
                      "maxItems": 30,
                      "items":
                        { "type": "string", "minLength": 1, "maxLength": 40 },
                      "description": "Paper-library categories; a/b is nested in a",
                    },
                  "id": { "type": "string" },
                  "type": { "enum": ["pdf", "epub"] },
                  "title": { "type": "string" },
                  "author": { "type": "string" },
                  "size": { "type": "number" },
                  "createdAt": { "type": "string" },
                  "lastOpenedAt": { "type": "string" },
                  "favorite": { "type": "boolean" },
                  "percentage": { "type": "number" },
                  "progress":
                    { "$ref": "#/components/schemas/DocumentLocation" },
                  "library": { "enum": ["books", "papers"] },
                  "deletedAt":
                    {
                      "type": "string",
