                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/resolve":
        {
          "post":
            {
              "summary": "Download a paper into the paper library from an arXiv ID, DOI, paper or PDF link, or title; metadata comes from arXiv, Crossref, Semantic Scholar, OpenReview or the page's citation tags",
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties": { "ref": { "type": "string" } },
                              "required": ["ref"],
                            },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "The same file already exists",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "201":
                    {
                      "description": "Imported",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}/metadata/lookup":
        {
          "post":
            {
              "summary": "Look up metadata by DOI, arXiv ID (also detected on the first pages) or a close title match; manual fields are kept",
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Updated",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}/note":
        {
          "get":
            {
              "summary": "The document's free-form paper note",
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Note (empty when unset)",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "properties":
                                    {
                                      "body":
                                        {
                                          "type": "string",
                                          "maxLength": 100000,
                                        },
                                      "updatedAt": { "type": "string" },
                                    },
                                  "required": ["body"],
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
          "put":
            {
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "body":
                                    { "type": "string", "maxLength": 100000 },
                                },
                              "required": ["body"],
                            },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Saved",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "properties":
                                    {
                                      "body":
                                        {
                                          "type": "string",
                                          "maxLength": 100000,
                                        },
                                      "updatedAt": { "type": "string" },
                                    },
                                  "required": ["body"],
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
    },
  "components":
    {
      "securitySchemes": { "session": { "type": "http", "scheme": "bearer" } },
      "schemas":
        {
          "DocumentLocation":
