{
  "openapi": "3.1.0",
  "info": { "title": "Reader Local API", "version": "0.1.0" },
  "security": [{ "session": [] }],
  "paths":
    {
      "/api/documents":
        {
          "get":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "array",
                                  "items":
                                    { "$ref": "#/components/schemas/Document" },
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
          "post":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "The identical file already exists, in either library",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "201":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "multipart/form-data":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "file":
                                    { "type": "string", "format": "binary" },
                                  "library":
                                    {
                                      "enum": ["books", "papers"],
                                      "description": "Target library. Papers accept PDFs up to 50 MB and 150 pages. Defaults to books.",
                                    },
                                },
                              "required": ["file"],
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}":
        {
          "patch":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "category":
                                    { "enum": ["book", "article", "paper"] },
                                  "tags":
                                    {
                                      "type": "array",
                                      "maxItems": 30,
                                      "items":
                                        {
                                          "type": "string",
                                          "minLength": 1,
                                          "maxLength": 40,
                                        },
                                    },
                                  "folders":
                                    {
                                      "type": "array",
                                      "maxItems": 30,
                                      "items":
                                        {
                                          "type": "string",
                                          "minLength": 1,
                                          "maxLength": 40,
                                        },
                                    },
                                  "favorite": { "type": "boolean" },
                                  "progress":
                                    {
                                      "$ref": "#/components/schemas/DocumentLocation",
                                    },
                                  "percentage": { "type": "number" },
                                  "title":
                                    {
                                      "type": "string",
                                      "minLength": 1,
                                      "maxLength": 300,
                                    },
                                  "author":
                                    { "type": "string", "maxLength": 200 },
                                  "library": { "enum": ["books", "papers"] },
                                  "metadata":
                                    {
                                      "type": "object",
                                      "description": "Fields to replace; each becomes a manual value. Empty strings clear a field.",
                                      "properties":
                                        {
                                          "itemType":
                                            {
                                              "enum":
                                                [
                                                  "journal",
                                                  "conference",
                                                  "preprint",
                                                  "thesis",
                                                  "book",
                                                  "chapter",
                                                  "report",
                                                  "other",
                                                ],
                                            },
                                          "translatedTitle":
                                            { "type": "string" },
                                          "shortTitle": { "type": "string" },
                                          "creators":
                                            {
                                              "type": "array",
                                              "maxItems": 200,
                                              "items":
                                                {
                                                  "$ref": "#/components/schemas/Creator",
                                                },
                                            },
                                          "affiliation": { "type": "string" },
                                          "date":
                                            {
                                              "type": "string",
                                              "pattern": "^\\d{4}(-\\d{2}(-\\d{2})?)?$",
                                            },
                                          "venue": { "type": "string" },
                                          "volume": { "type": "string" },
                                          "issue": { "type": "string" },
                                          "pages": { "type": "string" },
                                          "publisher": { "type": "string" },
                                          "doi": { "type": "string" },
                                          "arxiv": { "type": "string" },
                                          "isbn": { "type": "string" },
                                          "url": { "type": "string" },
                                          "abstract":
                                            {
                                              "type": "string",
                                              "maxLength": 20000,
                                            },
                                          "language": { "type": "string" },
                                          "remark":
                                            {
                                              "type": "string",
                                              "maxLength": 20000,
                                            },
                                        },
                                      "additionalProperties": false,
                                    },
                                  "readingStatus":
                                    { "enum": ["unread", "reading", "done"] },
                                },
                              "required": [],
                            },
                        },
                    },
                },
            },
          "delete":
            {
              "summary": "Permanently delete a document and its library-owned data after stopping background tasks",
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "204": { "description": "Deleted or already absent" },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
